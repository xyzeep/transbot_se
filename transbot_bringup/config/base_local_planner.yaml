DWAPlannerROS:
  max_vel_x: 0.3
  min_vel_x: 0.0
  max_vel_theta: 1.0
  min_vel_theta: -1.0
  min_in_place_vel_theta: 0.4

  acc_lim_x: 1.0
  acc_lim_theta: 1.5

  xy_goal_tolerance: 0.15
  yaw_goal_tolerance: 0.2

  sim_time: 1.5
  vx_samples: 10
  vtheta_samples: 20

  path_distance_bias: 32.0
  goal_distance_bias: 20.0
  occdist_scale: 0.02

  oscillation_reset_dist: 0.1

  holonomic_robot: false
